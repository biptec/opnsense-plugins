name: os-api-extensions quality

on:
  pull_request:
    paths:
      - "sysutils/api-extensions/**"
      - ".github/workflows/api-extensions-quality.yml"
  push:
    branches:
      - master
    paths:
      - "sysutils/api-extensions/**"
      - ".github/workflows/api-extensions-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y php-cli

      - name: Validate PHP
        run: |
          find sysutils/api-extensions -name '*.php' -print0 \
            | xargs -0 -r -n1 php -l

      - name: Validate XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in sorted(Path("sysutils/api-extensions").rglob("*.xml")):
              ET.parse(path)
              print(f"XML OK: {path}")
          PY

      - name: Run validation tests
        run: php sysutils/api-extensions/tests/test_validation.php

      - name: Run interface synchronization tests
        run: php sysutils/api-extensions/tests/test_interface_sync.php

      - name: Run endpoint synchronization tests
        run: php sysutils/api-extensions/tests/test_endpoint_sync.php

      - name: Run HAProxy policy synchronization tests
        run: php sysutils/api-extensions/tests/test_haproxy_sync.php

      - name: Run replacement ownership handoff tests
        run: php sysutils/api-extensions/tests/test_replacement_handoff.php

      - name: Run CARP health tests
        run: python3 -m unittest sysutils/api-extensions/tests/test_carp_health.py

      - name: Run CARP health WebGUI tests
        run: python3 -m unittest sysutils/api-extensions/tests/test_webgui.py

      - name: Run system DNS contract tests
        run: python3 -m unittest sysutils/api-extensions/tests/test_system_dns.py

      - name: Run local package status contract tests
        run: |
          sh -n sysutils/api-extensions/src/opnsense/scripts/OPNsense/ApiExtensions/package_status.sh
          python3 -m unittest sysutils/api-extensions/tests/test_package_status.py

      - name: Check whitespace
        run: git diff --check
