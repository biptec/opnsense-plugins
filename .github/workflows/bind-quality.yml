name: os-bind quality

on:
  pull_request:
    paths:
      - "dns/bind/**"
      - ".github/workflows/bind-quality.yml"
  push:
    branches:
      - master
    paths:
      - "dns/bind/**"
      - ".github/workflows/bind-quality.yml"

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PHP CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y bind9-utils php-cli

      - name: Install Python test dependencies
        run: python3 -m pip install --requirement dns/bind/tests/requirements.txt

      - name: Validate PHP
        run: |
          find dns/bind/src/opnsense/mvc/app -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Validate XML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          for path in sorted(Path("dns/bind/src/opnsense/mvc/app").rglob("*.xml")):
              ET.parse(path)
              print(f"XML OK: {path}")
          PY

      - name: Validate Python and portable shell
        run: |
          find dns/bind/src/opnsense -name '*.py' -print0 \
            | xargs -0 -n1 python3 -m py_compile
          # dnsbl.sh intentionally uses FreeBSD sh function names containing
          # hyphens, which Ubuntu dash rejects even though OPNsense accepts them.
          find dns/bind/src/opnsense -name '*.sh' ! -name 'dnsbl.sh' -print0 \
            | xargs -0 -r -n1 sh -n

      - name: Run BIND unit tests
        run: python3 -m unittest discover -s dns/bind/tests -p 'test_*.py'

      - name: Check whitespace
        run: git diff --check
