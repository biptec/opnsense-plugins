{# included in frr.conf #}
{% macro cline(directive, modelname) -%}{% if modelname %}
  ipv6 ospf6 {{ directive }} {{ modelname }}
{% endif %}{%- endmacro %}
{% from 'OPNsense/Macros/interface.macro' import physical_interface %}
{% if not helpers.empty('OPNsense.quagga.ospf6.enabled') %}
{#
  Native static routes behind HA-synchronized interfaces are consumer-owned.
  Derive their OSPFv3 export set from:
  staticroute -> gateway -> interface -> InterfaceSyncPolicy.synchronize.
#}
{% set nc_synced_interfaces = [] %}
{% for assignment in helpers.toList('OPNsense.ApiExtensions.InterfaceSyncPolicy.assignments.assignment') %}
{%   set policy = helpers.getUUID(assignment.policy_id) %}
{%   if policy != {} and policy.synchronize|default('0') == '1' %}
{%     do nc_synced_interfaces.append(assignment.interface) %}
{%   endif %}
{% endfor %}
{% set nc_synced_devices = [] %}
{% for identifier, ifcfg in interfaces.items() %}
{%   if identifier in nc_synced_interfaces and ifcfg.if|default('') and ifcfg.if not in nc_synced_devices %}
{%     do nc_synced_devices.append(ifcfg.if) %}
{%   endif %}
{% endfor %}
{% set nc_endpoint_gateways = [] %}
{% for gateway in helpers.toList('OPNsense.Gateways.gateway_item') %}
{%   if gateway.interface in nc_synced_interfaces and gateway.disabled|default('0') != '1' %}
{%     do nc_endpoint_gateways.append({'name': gateway.name, 'interface': gateway.interface}) %}
{%   endif %}
{% endfor %}
{% set nc_endpoint_kernel_routes = [] %}
{% for route in helpers.toList('staticroutes.route') %}
{%   if route.disabled|default('0') != '1' and route.enabled|default('1') == '1' and ':' in route.network %}
{%     for gateway in nc_endpoint_gateways %}
{%       if route.gateway == gateway.name and gateway.interface in interfaces and interfaces[gateway.interface].if|default('') %}
{%         do nc_endpoint_kernel_routes.append({'network': route.network, 'interface': gateway.interface, 'device': interfaces[gateway.interface].if}) %}
{%       endif %}
{%     endfor %}
{%   endif %}
{% endfor %}
{% set nc_explicit_kernel_redistribution = [] %}
{% for redistribution in helpers.toList('OPNsense.quagga.ospf6.redistributions.redistribution') %}
{%   if redistribution.enabled == '1' and redistribution.redistribute == 'kernel' %}
{%     do nc_explicit_kernel_redistribution.append('1') %}
{%   endif %}
{% endfor %}
{% if helpers.exists('OPNsense.quagga.general') %}
{%   if OPNsense.quagga.general.enablesnmp == '1' %}
agentx
{%   endif %}
{% endif %}
{% for interface in helpers.toList('OPNsense.quagga.ospf6.interfaces.interface') %}
{%   if interface.enabled == '1' %}
interface {{ physical_interface(interface.interfacename) }}
  ipv6 ospf6 area {{ interface.area }}
{%        if interface.bfd|default('') == '1' %}
  ipv6 ospf6 bfd
{%        endif %}
{% if interface.networktype  %}
  ipv6 ospf6 network {{ interface.networktype }}
{% endif %}
{% if interface.passive == '1' %}
  ipv6 ospf6 passive
{% endif %}
{{       cline("cost",interface.cost)
}}{{       cline("dead-interval",interface.deadinterval)
}}{{       cline("hello-interval",interface.hellointerval)
}}{{       cline("priority",interface.priority)
}}{{       cline("retransmit-interval",interface.retransmitinterval)
}}
{%   endif %}
{% endfor %}
router ospf6
{% if not helpers.empty('OPNsense.quagga.ospf6.routerid') %}
 ospf6 router-id {{ OPNsense.quagga.ospf6.routerid }}
{% endif %}
{% if not helpers.empty('OPNsense.quagga.ospf6.originate') %}
 default-information originate{% if not helpers.empty('OPNsense.quagga.ospf6.originatealways')  %} always {% endif %}{% if OPNsense.quagga.ospf6.originatemetric|default('') != '' %} metric {{ OPNsense.quagga.ospf6.originatemetric }}{% endif %}

{% endif %}
{% for redistribution in helpers.toList('OPNsense.quagga.ospf6.redistributions.redistribution') %}
{%   if redistribution.enabled == '1' %}
 redistribute {{ redistribution.redistribute }}{% if redistribution.linkedRoutemap %} route-map {{ helpers.getUUID(redistribution.linkedRoutemap).name }}{% endif +%}
{%   endif %}
{% endfor %}
{% if nc_endpoint_kernel_routes and nc_synced_devices and not nc_explicit_kernel_redistribution %}
 redistribute kernel route-map nc-endpoint-static-v6
{% endif %}
{% if helpers.exists('OPNsense.quagga.ospf6.networks.network') %}
{%   for network in helpers.toList('OPNsense.quagga.ospf6.networks.network') %}
{%     if network.enabled == '1' %}
 network {{ network.ipaddr }}/{{ network.netmask }} area {{ network.area }}
{%     endif %}
{%     if network.arearange|default("") != "" %}
 area {{ network.area }} range {{ network.arearange }}
{%     endif %}
{%     if network.linkedPrefixlistIn|default("") != "" %}
{%       for prefixlist in network.linkedPrefixlistIn.split(",") %}
{%         set prefixlist2_data = helpers.getUUID(prefixlist) %}
{%         if prefixlist2_data != {} and prefixlist2_data.enabled == '1' %}
 area {{ network.area }} filter-list prefix {{ prefixlist2_data.name }} in
{%         endif %}
{%       endfor %}
{%     endif %}
{%     if network.linkedPrefixlistOut|default("") != "" %}
{%       for prefixlist in network.linkedPrefixlistOut.split(",") %}
{%         set prefixlist_data = helpers.getUUID(prefixlist) %}
{%         if prefixlist_data != {} and prefixlist_data.enabled == '1' %}
 area {{ network.area }} filter-list prefix {{ prefixlist_data.name }} out
{%         endif %}
{%       endfor %}
{%     endif %}
{%   endfor %}
{% endif %}
{%   if helpers.exists('OPNsense.quagga.ospf6.prefixlists.prefixlist') %}
{%     for prefixlist in helpers.sortDictList(OPNsense.quagga.ospf6.prefixlists.prefixlist, 'name', 'seqnumber' ) %}
{%       if prefixlist.enabled == '1' %}
ipv6 prefix-list {{ prefixlist.name }} seq {{ prefixlist.seqnumber }} {{ prefixlist.action }} {{ prefixlist.network }}
{%       endif %}
{%     endfor %}
{%   endif %}
{% if nc_endpoint_kernel_routes and nc_synced_devices and not nc_explicit_kernel_redistribution %}
{%   for device in nc_synced_devices|sort %}
{%     set device_seq = loop.index * 10 %}
{%     set device_routes = [] %}
{%     for route in nc_endpoint_kernel_routes %}
{%       if route.device == device and route.network not in device_routes %}
{%         do device_routes.append(route.network) %}
{%       endif %}
{%     endfor %}
{%     if device_routes %}
{%       for network in device_routes|sort %}
ipv6 prefix-list nc-endpoint-static-v6-{{ device }} seq {{ loop.index * 10 }} permit {{ network }}
{%       endfor %}
route-map nc-endpoint-static-v6 permit {{ device_seq }}
 match ipv6 address prefix-list nc-endpoint-static-v6-{{ device }}
 match interface {{ device }}
{%     endif %}
{%   endfor %}
{% endif %}
{%   if helpers.exists('OPNsense.quagga.ospf6.routemaps.routemap') %}
{%     for routemap in helpers.sortDictList(OPNsense.quagga.ospf6.routemaps.routemap, 'name', 'id' ) %}
{%       if routemap.enabled == '1' %}
route-map {{ routemap.name }} {{ routemap.action }} {{ routemap.id }}
{# XXX: Multiple prefix lists that have the same name can be selected (intentionally), but each is stored as unique item. #}
{# The relationship is a bit loose, unique solves part of this issue. #}
{%         if routemap.match2|default("") != "" %}
{%           set prefixlist_names = [] %}
{%           for prefixlist in routemap.match2.split(",") %}
{%             set prefixlist_data = helpers.getUUID(prefixlist) %}
{%             do prefixlist_names.append(prefixlist_data.name) %}
{%           endfor %}
{%           for prefixlist_name in prefixlist_names | unique %}
 match ipv6 address prefix-list {{ prefixlist_name }}
{%           endfor %}
{%         endif %}
{%         if routemap.set|default("") != "" %}
 set {{ routemap.set }}
{%         endif %}
{%       endif %}
{%     endfor %}
{%   endif %}
{% endif %}
