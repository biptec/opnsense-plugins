[reconfigure_ntp]
command:/usr/local/opnsense/scripts/OPNsense/ApiExtensions/reconfigure_ntp.php
parameters:
type:script_output
message:reconfiguring NTP service

[reconfigure_resolver]
command:/usr/local/opnsense/scripts/OPNsense/ApiExtensions/reconfigure_resolver.php
parameters:
type:script_output
message:regenerating system resolver configuration

[refresh_staticroute_consumers]
command:/usr/local/sbin/pluginctl -c staticroutes
parameters:
type:script_output
message:refreshing dynamic-routing consumers of interface ownership

[package_status]
command:/usr/local/opnsense/scripts/OPNsense/ApiExtensions/package_status.sh
parameters:%s
type:script_output
message:reading local package status for %s

[carp_health_restart]
command:/usr/local/opnsense/scripts/OPNsense/ApiExtensions/carp_health_control.sh restart && echo ok
parameters:
type:script_output
message:restarting CARP health daemon

[carp_health_status]
command:/usr/local/sbin/carp-healthd status
parameters:
type:script_output
message:requesting CARP health daemon status

[haproxy_tls_identity_preflight]
command:/usr/local/opnsense/scripts/OPNsense/ApiExtensions/haproxy_tls_identity_reconcile.php preflight
parameters:%s
type:script_output
errors:no
message:preflighting Router-local HAProxy TLS identity %s

[haproxy_tls_identity_reconcile]
command:/usr/local/opnsense/scripts/OPNsense/ApiExtensions/haproxy_tls_identity_reconcile.php reconcile
parameters:
type:script_output
errors:no
message:reconciling Router-local HAProxy TLS identities
